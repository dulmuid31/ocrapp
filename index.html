<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR Scan to Excel (Offline PWA)</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background: #f9fafb; color: #1f2937; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #059669; }
    .btn-group { display: flex; gap: 10px; margin: 15px 0; }
    .btn-action { background: #3b82f6; color: white; padding: 12px 15px; border-radius: 8px; font-weight: 600; cursor: pointer; flex: 1; text-align: center; user-select: none; }
    .btn-gallery { background: #8b5cf6; }
    input[type="file"] { display: none; }
    .options-group { margin: 15px 0; background: #f3f4f6; padding: 12px; border-radius: 8px; font-size: 0.95em; }
    .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; }
    textarea { width: 100%; height: 160px; margin-top: 10px; border: 1px solid #d1d5db; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 0.9em; resize: vertical; }
    button#exportBtn { background: #10b981; color: white; border: none; padding: 14px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; font-size: 1em; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    #status { margin-top: 10px; font-size: 0.9em; color: #1d4ed8; font-weight: 500; word-break: break-word; }
    .error-msg { color: #dc2626 !important; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Scan Foto ke Excel</h2>
    
    <div class="btn-group">
      <label for="cameraInput" class="btn-action">📷 Kamera</label>
      <input type="file" id="cameraInput" accept="image/*" capture="environment">

      <label for="galleryInput" class="btn-action btn-gallery">🖼️ Galeri</label>
      <input type="file" id="galleryInput" accept="image/*">
    </div>

    <div id="status">Siap memproses gambar...</div>
    
    <div class="options-group">
      <label class="checkbox-label">
        <input type="checkbox" id="useHeaderCheck" checked>
        <span>Gunakan baris pertama sebagai Header / Nama Kolom</span>
      </label>
    </div>

    <h3>Review Data Hasil Scan:</h3>
    <textarea id="ocrOutput" placeholder="Data hasil scan akan muncul di sini... Anda juga bisa mengetik atau mengedit langsung di sini."></textarea>
    
    <button id="exportBtn" disabled>Download File Excel (.xlsx)</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
